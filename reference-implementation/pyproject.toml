[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumfai"
version = "0.1.0"
description = "Reference implementation of the PUMF Insights Assistant: LLM-planned, DuckDB-computed answers over StatCan-style public use microdata"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.70",
  "duckdb>=1.1",
  "pyarrow>=15",
  "numpy>=1.26",
  "jsonschema>=4.21",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pandas>=2.2", "httpx>=0.27"]

[project.scripts]
pumfai = "pumfai.__main__:main"

[tool.setuptools]
packages = ["pumfai"]

[tool.setuptools.package-data]
pumfai = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
